[project]
name = "python-template"
version = "0.10.4"
description = "Used to templatize python projects."
authors = [{ name = "Loïc Motheu", email = "lmotheu@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "loguru>=0.7.3,<0.8.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1,<3.0.0",
    "pre-commit>=4.6.2,<5.0.0",
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.16.6",
]

[tool.ruff]
src = ["src"]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "COM812", "ISC001", "D213", "FA102", "CPY001"]
fixable = ["ALL"]
unfixable = []
exclude = ["tests/*"]

[tool.mypy]
exclude = "tests/*"
